# XcodeGen 的工程描述。Dwell.xcodeproj 不进仓库，CI 上用 `xcodegen generate` 现生成。
name: Dwell
options:
  bundleIdPrefix: app.dwell
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Dwell:
    type: application
    platform: iOS
    sources:
      - Dwell
    settings:
      base:
        # Sideloadly 用你自己的 Apple ID 重签，会换成它自己的 Bundle ID，这里随便写一个就行。
        PRODUCT_BUNDLE_IDENTIFIER: app.dwell.ios
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: YES
    info:
      path: Dwell/Info.plist
      properties:
        CFBundleDisplayName: Dwell
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: 拍一张照片发给 Cloudy。
        UIAppFonts:
          - Ephesis-Regular.ttf
        # Bark 通知点开时用 dwell://open?chat=… 回到 app 里那一间。
        CFBundleURLTypes:
          - CFBundleURLName: app.dwell.ios
            CFBundleURLSchemes:
              - dwell
