# 在 GitHub 的 Mac 上编译 iOS app，产出一个没签名的 Dwell.ipa。
# 签名和安装交给 Windows 上的 Sideloadly（用你自己的免费 Apple ID），见 ios/README.md。
name: iOS build

on:
  push:
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Pick newest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Generate Xcode project
        working-directory: ios
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build
        working-directory: ios
        run: |
          # 以 xcodebuild 自己的退出码为准：编译失败时 .app 目录可能已经建了一半，光看目录在不在会被骗。
          if ! xcodebuild \
            -project Dwell.xcodeproj \
            -scheme Dwell \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build > build.log 2>&1; then
            grep -E "error:" build.log || tail -60 build.log
            exit 1
          fi
          grep -E "warning:|BUILD SUCCEEDED" build.log || true
          test -x build/Build/Products/Release-iphoneos/Dwell.app/Dwell

      - name: Package IPA
        working-directory: ios
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Dwell.app Payload/
          zip -qry Dwell.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: Dwell-ipa
          path: ios/Dwell.ipa
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-log
          path: ios/build.log
